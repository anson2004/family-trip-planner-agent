name: CI/CD

# test -> build -> deploy, as three jobs so each shows as its own check on the commit.
# Pull requests only run the tests. Pushes to master (or a manual run) also build and deploy.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Cancel superseded PR runs, but never stop a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No real secrets: the tests use a scripted fake LLM and mocked HTTP for SerpApi/Tavily,
      # so they never call Groq or any other paid API. Dummy values make sure of it.
      GROQ_API_KEY: ci-dummy
      SERPAPI_API_KEY: ci-dummy
      TAVILY_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # log in to Google Cloud without a stored key
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-plan/app
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log Docker in to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REPO }}:${{ github.sha }}
            ${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        name: Exact image for the deploy job
        run: echo "image=${REPO}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # log in to Google Cloud without a stored key
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - name: Deploy
        run: infra/deploy.sh
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          IMAGE: ${{ needs.build.outputs.image }}
