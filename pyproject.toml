[project]
name = "travel-plan-agent"
version = "0.1.0"
description = "LangChain + Groq agent that plans flight + hotel holidays from Finland within a budget"
readme = "README.md"
authors = [
    { name = "Yiqing Liang", email = "yiqing@intelligentfridges.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
travel-plan = "travel_plan_agent:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
